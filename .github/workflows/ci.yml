name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: herbwire
          POSTGRES_USER: herbwire
          POSTGRES_PASSWORD: herbwire_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U herbwire -d herbwire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HERBWIRE_DATABASE_URL: postgresql+psycopg://herbwire:herbwire_dev@127.0.0.1:5432/herbwire
      HERBWIRE_FRONTEND_ORIGIN: http://127.0.0.1:5173
      HERBWIRE_API_HOST: 127.0.0.1
      HERBWIRE_API_PORT: 8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Ruff lint
        run: python -m ruff check backend
      - name: Ruff format check
        run: python -m ruff format --check backend
      - name: Migration cycle
        run: |
          python -m alembic -c backend/alembic.ini current
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head
      - name: Backend tests
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend lint
        run: npm run lint
      - name: Frontend tests
        run: npm run test
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend build
        run: npm run build