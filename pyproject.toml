[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herbwire-backend"
version = "0.1.0"
description = "HerbWire V2 backend walking skeleton"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.52,<0.53",
  "pydantic-settings>=2.15,<2.16",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.3,<4.0",
  "alembic>=1.19,<1.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
  "httpx>=0.28,<0.29",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]